<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/aa3a5bcb91.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>English Janala</title>
</head>

<body class="">
    <header class="border-b-2 border-gray-300 bg-gray-100">
        <nav class="flex justify-between items-center py-5 container mx-auto">
            <div class="flex items-center gap-2 text-xl font-bold">
                <p>English</p>
                <i class="fa-brands fa-windows text-blue-600"></i>
                <p>জানালা</p>
            </div>
            <div class="flex gap-3 items-center">
                <button class="btn btn-sm btn-soft btn-primary border-blue-700"><i class="fa-solid fa-question"></i>
                    FAQ</button>
                <button class="btn btn-sm btn-soft btn-primary border-blue-700"><i class="fa-solid fa-book-open"></i>
                    Learn</button>
                <button class="btn btn-sm btn-soft btn-primary border-blue-700"><i
                        class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
            </div>
        </nav>
    </header>
    <!-- hero section -->
    <section class="container mx-auto">
        <div class="flex justify-between items-center">
            <div class="space-y-4 max-w-150">
                <p class="text-3xl font-bold"><span class="text-blue-500">English</span> is Easy!!</p>
                <p>আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের
                    Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ</p>
                <form class="flex flex-col space-y-3">
                    <input type="text" placeholder="Enter your name"
                        class="input focus:outline-none focus:border-blue-600" />
                    <input type="password" placeholder="Provide password (123456)"
                        class="input focus:outline-none focus:border-blue-600" />
                    <button class="btn btn-primary w-28" type="submit">Get Started</button>
                </form>
            </div>
            <div class="max-w-150">
                <img class="w-full" src="assets/hero-student.png" alt="">
            </div>
        </div>
    </section>
</body>

</html>
